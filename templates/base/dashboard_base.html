<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Group Management | Savvy</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #bdcaba;
            border-radius: 10px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#0b1c30",
                        "outline-variant": "#bdcaba",
                        "on-secondary-container": "#007233",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#4ae176",
                        "surface": "#f8f9ff",
                        "primary-fixed": "#7ffc97",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#006e2d",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#002109",
                        "inverse-primary": "#62df7d",
                        "on-secondary-fixed": "#00210a",
                        "primary-container": "#00873a",
                        "primary": "#006b2c",
                        "outline": "#6e7b6c",
                        "on-background": "#0b1c30",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "secondary": "#006d30",
                        "surface-bright": "#f8f9ff",
                        "secondary-container": "#92f5a4",
                        "inverse-surface": "#213145",
                        "secondary-fixed": "#95f8a7",
                        "on-tertiary-container": "#f7fff3",
                        "surface-container-low": "#eff4ff",
                        "on-primary-fixed-variant": "#005320",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f8f9ff",
                        "on-tertiary-fixed": "#002109",
                        "on-primary-container": "#f7fff2",
                        "tertiary-fixed": "#6bff8f",
                        "surface-dim": "#cbdbf5",
                        "primary-fixed-dim": "#62df7d",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#005323",
                        "surface-variant": "#d3e4fe",
                        "surface-container": "#e5eeff",
                        "error-container": "#ffdad6",
                        "tertiary": "#006b2d",
                        "on-surface-variant": "#3e4a3d",
                        "surface-container-high": "#dce9ff",
                        "surface-container-highest": "#d3e4fe",
                        "tertiary-container": "#00873b",
                        "secondary-fixed-dim": "#79db8d",
                        "on-tertiary-fixed-variant": "#005321"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "xxl": "48px",
                        "xs": "4px",
                        "lg": "24px",
                        "base": "8px",
                        "xl": "32px",
                        "container-max": "1280px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "label-xs": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "label-xs": ["12px", {"lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-sm": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background font-body-md text-on-surface custom-scrollbar">
    {% block content %}

    {% endblock %}

<script>
        // Simple micro-interaction for rows
        document.querySelectorAll('tbody tr').forEach(row => {
            row.addEventListener('click', () => {
                row.classList.add('opacity-80', 'scale-95');
                setTimeout(() => row.classList.remove('opacity-80', 'scale-95'), 150);
            });
        });

        // Search bar focus effect
        const searchInput = document.querySelector('input[type="text"]');
        searchInput?.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('ring-2', 'ring-primary/20');
        });
        searchInput?.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('ring-2', 'ring-primary/20');
        });
    </script>
</body>
</html>
