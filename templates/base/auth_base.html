<body class="min-h-screen flex items-center justify-center p-0 m-0 overflow-x-hidden bg-background">
<!-- Main Container: Split Screen Desktop / Centered Card Mobile -->



{% block content %}

{% endblock %}




<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const submitBtn = form.querySelector('button[type="submit"]');

            form.addEventListener('submit', (e) => {
            
                submitBtn.innerHTML = `
                    <div class="flex items-center justify-center gap-sm">
                        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Authenticating...
                    </div>
                `;
                
                // Simulate a delay
                setTimeout(() => {
                    submitBtn.innerHTML = 'Sign In';
                }, 2000);
            });

            // Toggle visibility logic
            const visibilityBtn = document.querySelector('button[type="button"]');
            const passInput = document.getElementById('password');
            let visible = false;

            visibilityBtn.addEventListener('click', () => {
                visible = !visible;
                passInput.type = visible ? 'text' : 'password';
                visibilityBtn.querySelector('span').innerText = visible ? 'visibility_off' : 'visibility';
            });
        });
    </script>
</body>
